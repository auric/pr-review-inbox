name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      # The typecheck scripts run tsc with Node.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # The compiled-binary test skips, because dist/bin does not exist on a fresh checkout.
      - run: bun run check
      - run: bun run notices --check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      # The Playwright runner needs Node 20 or later.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The repo pins @playwright/test. Its own CLI installs the matching Chromium.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      # The browser cache does not hold the system packages.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: node node_modules/@playwright/test/cli.js install-deps chromium
      - run: bun run test:e2e
      # A flaky test passes on the retry, so the job passes. Its failed attempt keeps a trace in test-results/.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
